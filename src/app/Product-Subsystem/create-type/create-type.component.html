<h2 mat-dialog-title>Add New Type</h2>

<mat-dialog-content>
  <div class="form-group">
    <label>Category</label>
    <select [formControl]="selectedCategory" class="form-select modern-select">
      <option value="">Select a category</option>
      <option *ngFor="let category of categories" [value]="category.productCategoryId">
        {{ category.categoryName }}
      </option>
    </select>
    <div *ngIf="selectedCategory.invalid && selectedCategory.touched" class="error-message">
      Please select a category
    </div>
  </div>

  <div class="form-group">
    <label>Type Name</label>
    <input type="text" [formControl]="typeName" placeholder="e.g., Road Running Shoes" class="form-input">
    <div *ngIf="typeName.invalid && typeName.touched" class="error-message">
      Type name is required
    </div>
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea [formControl]="description" rows="3" placeholder="Description of the type" class="form-textarea"></textarea>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!typeName.valid || !selectedCategory.valid || isSaving">
    {{ isSaving ? 'Saving...' : 'Save' }}
  </button>
</mat-dialog-actions>

<!-- Notification Modal -->
<app-notification-modal></app-notification-modal>
