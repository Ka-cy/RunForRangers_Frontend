<app-nav-bar-admin></app-nav-bar-admin>

<div class="main-content">
  <div class="header">
    <div class="user-info">
      <div class="user-avatar">HB</div>
      <div class="user-details">
        <h4>Harry Bailey</h4>
        <p>Admin</p>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <h1 class="page-title">Edit Donation</h1>
      <p class="page-description">Update the details of the selected donation.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="donation-form">
      <div class="form-group">
        <mat-form-field appearance="fill">
          <mat-label>Donation Type</mat-label>
          <mat-select [(ngModel)]="selectedType" (selectionChange)="selectDonationType($event.value)" name="donationType">
            <mat-option *ngFor="let type of donationTypes" [value]="type">{{ type }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-group" *ngIf="selectedType === 'Runner'">
        <mat-form-field appearance="fill">
          <mat-label>Select Runner</mat-label>
          <mat-select [(ngModel)]="selectedRunnerId" (selectionChange)="onRunnerSelect($event)" name="runner">
            <mat-option [value]="null">Select a runner</mat-option>
            <mat-option *ngFor="let runner of runners" [value]="runner.userId">
              {{ runner.firstName }} {{ runner.surname }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="fill">
          <mat-label>Donation Amount</mat-label>
          <input matInput type="number" [(ngModel)]="donation.amount" name="amount" required min="0">
        </mat-form-field>
      </div>

      <div class="form-group">
        <mat-form-field appearance="fill">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="picker" [(ngModel)]="donation.date" name="date" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn">Save Changes</button>
        <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
