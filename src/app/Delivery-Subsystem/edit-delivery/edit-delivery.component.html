<div class="dashboard-container">
  <div class="top-navbar">
    <div class="search-container">
      <div class="page-title">Edit Delivery</div>
    </div>

    <div class="user-profile">
      <div class="profile-icon" (click)="toggleProfileMenu()">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
        </svg>
      </div>
      <div class="profile-menu" *ngIf="showProfileMenu">
        <div class="menu-item">My Profile</div>
        <div class="menu-item">Settings</div>
        <div class="menu-item" (click)="logout()">Logout</div>
      </div>
    </div>
  </div>

  <app-nav-bar-admin></app-nav-bar-admin>
  
  <div class="content-area">
    <div class="page-header">
      <h1>Edit Delivery</h1>
      <button class="back-btn" (click)="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Deliveries
      </button>
    </div>

    <div class="form-container" *ngIf="!isLoading">
      <form [formGroup]="deliveryForm" (ngSubmit)="onSubmit()" class="delivery-form">
        
        <!-- Order Information (Read-only) -->
        <div class="form-section">
          <h3>Order Information (Read-only)</h3>
          <div class="form-row">
            <div class="form-group">
              <label for="orderId">Order ID</label>
              <input 
                type="number" 
                id="orderId" 
                formControlName="orderId"
                class="form-control"
                readonly>
            </div>
            
            <div class="form-group">
              <label for="trackingNumber">Tracking Number</label>
              <input 
                type="text" 
                id="trackingNumber" 
                formControlName="trackingNumber"
                class="form-control"
                readonly>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="deliveryDate">Delivery Date</label>
              <input 
                type="datetime-local" 
                id="deliveryDate" 
                formControlName="deliveryDate"
                class="form-control"
                readonly>
            </div>
            
            <div class="form-group">
              <label for="deliveryAddressId">Delivery Address ID</label>
              <input 
                type="number" 
                id="deliveryAddressId" 
                formControlName="deliveryAddressId"
                class="form-control"
                readonly>
            </div>
          </div>
        </div>

        <!-- Editable Delivery Information -->
        <div class="form-section">
          <h3>Delivery Management</h3>
          <div class="form-row">
            <div class="form-group">
              <label for="deliveryStatus">Delivery Status</label>
              <select 
                id="deliveryStatus" 
                formControlName="deliveryStatus"
                class="form-control"
                [class.error]="deliveryForm.get('deliveryStatus')?.invalid && deliveryForm.get('deliveryStatus')?.touched">
                <option value="">Select Status</option>
                <option *ngFor="let status of deliveryStatuses" [value]="status.statusName">
                  {{ status.statusName }}
                </option>
              </select>
              <div class="error-message" *ngIf="deliveryForm.get('deliveryStatus')?.invalid && deliveryForm.get('deliveryStatus')?.touched">
                Delivery status is required
              </div>
            </div>

            <div class="form-group">
              <label for="courierId">Assign Courier</label>
              <select 
                id="courierId" 
                formControlName="courierId"
                class="form-control">
                <option value="">Select Courier (Optional)</option>
                <option *ngFor="let courier of couriers" [value]="courier.courierId">
                  {{ courier.courierName }} - {{ courier.email }}
                </option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group waybill-group">
              <label for="waybill">
                Waybill Number
                <span class="status-note" *ngIf="deliveryForm.get('waybill')?.disabled">
                  (Only editable when status is "In Transit")
                </span>
              </label>
              <input 
                type="text" 
                id="waybill" 
                formControlName="waybill"
                class="form-control"
                placeholder="Enter waybill number"
                [class.disabled]="deliveryForm.get('waybill')?.disabled">
              <div class="help-text">
                The waybill number can only be edited when the delivery status is set to "In Transit"
              </div>
            </div>
          </div>
        </div>

        <!-- Error Display -->
        <div class="error-display" *ngIf="error">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          {{ error }}
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="button" class="cancel-btn" (click)="goBack()">Cancel</button>
          <button 
            type="submit" 
            class="submit-btn" 
            [disabled]="deliveryForm.invalid || isSaving">
            <span *ngIf="isSaving">Updating...</span>
            <span *ngIf="!isSaving">Update Delivery</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <div class="loading-spinner"></div>
      <p>Loading delivery data...</p>
    </div>
  </div>
</div>
