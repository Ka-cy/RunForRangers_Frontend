<!-- Navigation Bars -->
<div *ngIf="adminData">
    <app-nav-bar-admin></app-nav-bar-admin>
</div>

<div *ngIf="userData && !adminData">
    <app-nav-bar-default></app-nav-bar-default>
</div>

<!-- Password Update Form -->
<div class="form-container">
    <div class="form-card">
        <!-- Change Password Section Header -->
        <div class="section-header">
            <div class="section-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="section-title">Change Password</h3>
        </div>

        <!-- Form Fields -->
        <div class="form-content">
            <!-- New Password Field -->
            <div class="input-group">
                <label for="Password" class="input-label">New Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input 
                        type="password" 
                        id="Password" 
                        name="Password" 
                        [(ngModel)]="inPuts.Password" 
                        class="form-input"
                        [class.error]="errorMessage.errorPassword"
                        placeholder="Enter new password"
                        required>
                </div>
                <div class="error-message" *ngIf="errorMessage.errorPassword">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ errorMessage.errorPassword }}
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="input-group">
                <label for="ConfirmPassword" class="input-label">Confirm Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input 
                        type="password" 
                        id="ConfirmPassword" 
                        name="ConfirmPassword" 
                        [(ngModel)]="inPuts.ConfirmPassword" 
                        class="form-input"
                        [class.error]="errorMessage.errorConfirmPassword"
                        placeholder="Confirm new password"
                        required>
                </div>
                <div class="error-message" *ngIf="errorMessage.errorConfirmPassword">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ errorMessage.errorConfirmPassword }}
                </div>
            </div>

           
            <!-- Action Buttons -->
            <div class="button-group">
                <button type="submit" class="btn btn-save" (click)="updatePassword()">
                    <i class="fas fa-save"></i>
                    Save Changes
                </button>
                <button type="button" class="btn btn-cancel" (click)="cancel()">
                    <i class="fas fa-times"></i>
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
<app-notification-modal></app-notification-modal>
