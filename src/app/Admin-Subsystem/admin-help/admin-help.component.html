<!-- Nav Bar -->
<app-nav-bar-admin></app-nav-bar-admin>

<div class="help-container">
  <!-- Help Header -->
  <div class="help-header">
    <h1>Help</h1>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <div class="search-input-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search for help topics..."
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()"
        (keyup.enter)="onSearchSubmit()"
      />
    </div>
    
    <!-- Category Filter -->
    <div class="category-section">
      <select
        class="category-select"
        [(ngModel)]="selectedCategory"
        (change)="onCategoryChange()">
        <option *ngFor="let category of categories" [value]="category.value">
          {{ category.label }}
        </option>
      </select>
      
      <button class="help-doc-btn" (click)="openHelpDocument()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14,2 14,8 20,8"></polyline>
        </svg>
        View Help Document
      </button>
    </div>
  </div>

  <!-- Results Text -->
  <div class="results-text" *ngIf="searchQuery || selectedCategory !== 'all'">
    {{ searchResultText }}
    <button class="clear-filters" (click)="clearSearch()">Clear filters</button>
  </div>

  <!-- FAQ List -->
  <div class="faq-list" *ngIf="hasResults">
    <div class="faq-item" *ngFor="let item of filteredFaqItems; let i = index">
      <div class="faq-question" (click)="toggleAnswer(i)">
        <span [innerHTML]="highlightSearchTerm(item.question)"></span>
        <svg
          class="chevron"
          [class.rotated]="item.isOpen"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">
          <polyline points="6,9 12,15 18,9"></polyline>
        </svg>
      </div>
      <div class="faq-answer" [class.active]="item.isOpen">
        <div [innerHTML]="highlightSearchTerm(formatAnswer(item.answer))"></div>
      </div>
    </div>
  </div>

  <!-- No Results Message -->
  <div class="no-results" *ngIf="!hasResults">
    <h3>No results found</h3>
    <p>Try adjusting your search terms or browse all categories.</p>
    <button class="show-all-btn" (click)="clearSearch()">Show all questions</button>
  </div>
</div>
